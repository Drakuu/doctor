<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./public/output.css">
  <!-- Include Font Awesome Pro for access to 'thin' and 'regular' styles -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart-container {
      height: 600px;
      /* margin-block: 2rem; */
      /* width: 100%; */
      margin-top: 0px;

    }

    .chart-container2 {
      height: 400px;
      margin-top: 60px;
      padding: 1rem;

    }


    @media screen and (min-width:1024px) {

      .charts {
        display: flex;
        justify-content: space-between;
        align-items: center;

      }

      .chart-container {
        width: 100%;
        padding: 0.25rem;
        margin-top: 0;
      }

    }

    @media (min-width: 768px) {
      .chart-container {
        width: 100%;
        padding: 0.25rem;
      }

      .chart-container2 {
        width: 100%;
      }
    }

    @media (min-width: 1024px) {
      .chart-container {
        width: 75%;
        padding: 0.2rem;
        /* margin-block: 0; */
      }

      .chart-container2 {
        width: 50%;
        height: 650px;
        margin-inline: 2rem;
      }
    }

    canvas {
      width: 100%;
    }
  </style>
    <title>Doctris | The WebSite </title>

</head>

<body class="font-sans">

  <!-- Navbar -->
  <nav class="bg-white shadow-lg p-2 md:p-4 flex justify-between items-center">
    <!-- Left Section -->
    <div class="flex items-center space-x-2">
      <!-- Parent div with relative positioning for the dropdown -->
      <div class="relative">
        <!-- Button to toggle the menu -->
        <button aria-label="Open menu" onclick="toggleMenu('menuOptions')"
          class="text-blue-500 border border-blue-100 text-sm md:text-xl bg-blue-50 rounded-full py-2 px-3">
          <i  onclick="toggleMenu('menuOptions')" class="fa-solid fa-bars"></i>
        </button>

        <!-- Hamburger Menu Dropdown -->
        <div id="menuOptions"
          class="w-48 text-center border border-gray-200  absolute bg-white rounded-md hidden z-10 top-12 left-0 mt-2">
          <ul>
            <!-- Page 1 with anchor link -->
            <li class="p-1">
              <a href="./HTML/doctors.html"
                class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Doctor profile</a>
            </li>
            <!-- Option 2 with similar styling -->
            <li class="p-1">
              <a href="./HTML/patient_list.html" class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Patient list</a>
              </a>
            </li>
            <!-- Option 3 with similar styling -->
            <li class="p-1">
              <a href="/HTML/appointment.html" class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Appointments
              </a>
            </li>
            <li class="p-1">
              <a href="index.html" class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Dashboard
              </a>
            </li>
          </ul>
        </div>


      </div>

      <!-- Search Bar -->
      <div class="flex items-center border-2 border-gray-300 rounded-full px-2 py-1.5 md:px-4 md:py-2">
        <input type="text" placeholder="Search Keywords..." class="bg-transparent focus:outline-none text-sm">
        <i class="fas fa-search text-gray-500"></i>
      </div>
    </div>


    <!-- Right Section -->
    <div class="flex items-center space-x-2">
      <!-- Language Selector -->
      <div class="hidden md:block relative">
        <button aria-label="Select Language" onclick="toggleMenu('languageMenu')"
          class="text-blue-500 border border-blue-100 text-xl bg-blue-50 rounded-full py-2 px-3">
          <i class="fas fa-globe"></i>
        </button>
        <!-- Language Dropdown -->
        <div id="languageMenu" class="absolute bg-white shadow-md rounded-md p-4 mt-2 hidden">
          <ul>
            <li class="p-2 hover:bg-gray-100 cursor-pointer">English</li>
            <li class="p-2 hover:bg-gray-100 cursor-pointer">Spanish</li>
            <li class="p-2 hover:bg-gray-100 cursor-pointer">French</li>
          </ul>
        </div>
      </div>

      <!-- Settings Icon -->
      <div class="hidden md:block relative">
        <button aria-label="Open Settings" onclick="toggleMenu('settingsMenu')"
          class="text-blue-500 border border-blue-100 text-xl bg-blue-50 rounded-full py-2 px-3">
          <i class="fa-solid fa-gear"></i>
        </button>
        <!-- Settings Dropdown -->
        <div id="settingsMenu" class="absolute bg-white shadow-md rounded-md p-4 mt-2 hidden">
          <ul>
            <li class="p-2 hover:bg-gray-100 cursor-pointer">Option 1</li>
            <li class="p-2 hover:bg-gray-100 cursor-pointer">Option 2</li>
            <li class="p-2 hover:bg-gray-100 cursor-pointer">Option 3</li>
          </ul>
        </div>
      </div>

      <!-- Message Icon -->
      <div class="hidden md:block relative">
        <button aria-label="View Messages"
          class="text-blue-500 border border-blue-100 text-xl bg-blue-50 rounded-full py-2 px-3 relative">
          <i class="fa-regular fa-envelope"></i>
          <!-- Message Notification -->
          <span class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full px-1">1</span>
        </button>
      </div>

      <!-- Doctor Image -->
      <div class="text-blue-500 border border-blue-100 bg-blue-50 rounded-full">
        <img src="./Assets/jonny.png" alt="Doctor Profile Picture" class="w-8 md:w-11 h-8 md:h-11 rounded-full">
      </div>
    </div>
  </nav>

  <header class="pl-2 lg:pl-10 py-9 pr-2 bg-gray-100">
    <h1 class="text-xl pb-2 font-bold text-gray-700 ">Dashboard</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2  md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">
      <div class="bg-white rounded-lg shadow p-5 flex items-center space-x-4">
        <div class="bg-blue-50 p-3 rounded-md">
          <i class="fa fa-procedures text-blue-500 text-2xl"></i>
        </div>
        <div>
          <div class="text-lg font-semibold">558</div>
          <div class="text-sm text-gray-500">Patients</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-5 flex items-center space-x-4">
        <div class="bg-blue-50 p-3 rounded-md">
          <i class="fa-solid fa-file-waveform text-blue-500 text-2xl"></i>
        </div>
        <div>
          <div class="text-lg font-semibold">$2164</div>
          <div class="text-sm text-gray-500">Avg. Costs</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-5 flex items-center space-x-4">
        <div class="bg-blue-50 p-3 rounded-md">
          <i class="fa fa-users text-blue-500 text-2xl"></i>
        </div>
        <div>
          <div class="text-lg font-semibold">112</div>
          <div class="text-sm text-gray-500">Staff Members</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-5 flex items-center space-x-4">
        <div class="bg-blue-50 p-3 rounded-md">
          <i class="fa-solid fa-truck-medical text-blue-500 text-2xl"></i>
        </div>
        <div>
          <div class="text-lg font-semibold">16</div>
          <div class="text-sm text-gray-500">Vehicles</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-5 flex items-center space-x-4">
        <div class="bg-blue-50 p-3 rounded-md">
          <i class="fa-solid fa-briefcase-medical text-blue-500 text-2xl"></i>
        </div>
        <div>
          <div class="text-lg font-semibold">220</div>
          <div class="text-sm text-gray-500">Appointments</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-5 flex items-center space-x-4">
        <div class="bg-blue-50 p-3 rounded-md">
          <i class="fa fa-user-md text-blue-500 text-2xl"></i>
        </div>
        <div>
          <div class="text-lg font-semibold">10</div>
          <div class="text-sm text-gray-500">Operations</div>
        </div>
      </div>
    </div>



    <div class="charts  gap-5">
      <!-- First Chart: Patient Visit By Gender -->
      <div class="chart-container ">
        <div class="flex justify-between p-2 bg-white rounded-md items-center">
          <!-- Title -->
          <h1 class="text-base md:text-xl font-bold">Patient Visit By Gender</h1>

          <!-- Dropdown -->
          <select name="year" id="year-select" class="px-4 py-2 border rounded-md shadow-sm">
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
          </select>
        </div>
        <!-- Chart Canvas -->
        <canvas class="bg-white" id="myChart"></canvas>
      </div>

      <!-- Second Chart: Patients by Department -->
      <div class="chart-container2 bg-white shadow-md rounded-lg p-6 w-full lg:w-1/2 ">
        <div class="flex justify-between items-center mb-4">
          <h1 class="text-lg font-bold text-center">Patients by Department</h1>
          <select name="timeframe" id="timeframe-select" class="px-4 py-2 border rounded-md shadow-sm text-sm">
            <option value="today">Today</option>
            <option value="this-week">This Week</option>
            <option value="this-month">This Month</option>
            <option value="this-year">This Year</option>
          </select>
        </div>

        <!-- Chart Canvas -->
        <div class="flex justify-center items-center h-full">

          <div class="">
            <canvas id="multiLayerRadialChart" class="w-9/12  h-9/12 "></canvas>
          </div>

        </div>
      </div>
    </div>

  </header>

  <!-- FontAwesome Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>

  <script src="./JS/index.js"></script>


</body>

</html>
