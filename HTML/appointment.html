<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <!-- Include Font Awesome Pro for access to 'thin' and 'regular' styles -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Doctris | Patients List</title>
</head>

<body class="font-sans">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg p-2 md:p-4 flex justify-between items-center">
        <!-- Left Section -->
        <div class="flex items-center space-x-2">
            <!-- Parent div with relative positioning for the dropdown -->
            <div class="relative">
                <!-- Button to toggle the menu -->
                <button aria-label="Open menu" onclick="toggleMenu('menuOptions')"
                    class="text-blue-500 border border-blue-100 text-sm md:text-xl bg-blue-50 rounded-full py-2 px-3">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- Hamburger Menu Dropdown -->
                <div id="menuOptions"
                    class="w-48 text-center border border-gray-200  absolute bg-white rounded-md hidden z-10 top-12 left-0 mt-2">
                    <ul>
                        <!-- Page 1 with anchor link -->
                        <li class="p-1">
                            <a href="doctors.html"
                                class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Doctor
                                profile</a>
                        </li>
                        <!-- Option 2 with similar styling -->
                        <li class="p-1">
                            <a href="patient_list.html"
                                class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Patient
                                list</a>
                            </a>
                        </li>
                        <!-- Option 3 with similar styling -->
                        <li class="p-1">
                            <a href="appointment.html"
                                class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Appointments
                            </a>
                        </li>
                        <li class="p-1">
                            <a href="Index.html"
                                class="text-blue-500 border-b border-gray-400 px-3 py-1.5 rounded-md block">Dashboard
                            </a>
                        </li>
                    </ul>
                </div>


            </div>

            <!-- Search Bar -->
            <div class="flex items-center border-2 border-gray-300 rounded-full px-2 py-1.5 md:px-4 md:py-2">
                <input type="text" placeholder="Search Keywords..." class="bg-transparent focus:outline-none text-sm">
                <i class="fas fa-search text-gray-500"></i>
            </div>
        </div>


        <!-- Right Section -->
        <div class="flex items-center space-x-2">
            <!-- Language Selector -->
            <div class="hidden md:block relative">
                <button aria-label="Select Language" onclick="toggleMenu('languageMenu')"
                    class="text-blue-500 border border-blue-100 text-xl bg-blue-50 rounded-full py-2 px-3">
                    <i class="fas fa-globe"></i>
                </button>
                <!-- Language Dropdown -->
                <div id="languageMenu" class="absolute bg-white shadow-md rounded-md p-4 mt-2 hidden">
                    <ul>
                        <li class="p-2 hover:bg-gray-100 cursor-pointer">English</li>
                        <li class="p-2 hover:bg-gray-100 cursor-pointer">Spanish</li>
                        <li class="p-2 hover:bg-gray-100 cursor-pointer">French</li>
                    </ul>
                </div>
            </div>

            <!-- Settings Icon -->
            <div class="hidden md:block relative">
                <button aria-label="Open Settings" onclick="toggleMenu('settingsMenu')"
                    class="text-blue-500 border border-blue-100 text-xl bg-blue-50 rounded-full py-2 px-3">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <!-- Settings Dropdown -->
                <div id="settingsMenu" class="absolute bg-white shadow-md rounded-md p-4 mt-2 hidden">
                    <ul>
                        <li class="p-2 hover:bg-gray-100 cursor-pointer">Option 1</li>
                        <li class="p-2 hover:bg-gray-100 cursor-pointer">Option 2</li>
                        <li class="p-2 hover:bg-gray-100 cursor-pointer">Option 3</li>
                    </ul>
                </div>
            </div>

            <!-- Message Icon -->
            <div class="hidden md:block relative">
                <button aria-label="View Messages"
                    class="text-blue-500 border border-blue-100 text-xl bg-blue-50 rounded-full py-2 px-3 relative">
                    <i class="fa-regular fa-envelope"></i>
                    <!-- Message Notification -->
                    <span
                        class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full px-1">1</span>
                </button>
            </div>

            <!-- Doctor Image -->
            <div class="text-blue-500 border border-blue-100 bg-blue-50 rounded-full">
                <img src="../Assets/jonny.png" alt="Doctor Profile Picture"
                    class="w-8 md:w-11 h-8 md:h-11 rounded-full">
            </div>
        </div>
    </nav>

 <!-- Header Section -->
<header class="pl-2 lg:pl-10 py-9 pr-2 bg-gray-100">
    <div class="md:flex md:justify-between ">
        <h1 class="text-xl pb-2 font-bold text-gray-700">Appointments</h1>
        <div class="flex items-center space-x-2">
            <button id="addAppointmentBtn" class="bg-blue-500 text-white text-sm lg:text-base py-2 px-4 rounded-xl my-2 md:my-0">
                Add Appointments
            </button>
        </div>
    </div>
</header>

<!-- Table Section -->
<div class="overflow-x-auto px-4 pb-6 bg-gray-100">
    <table class="min-w-full bg-white border-collapse" id="patientTable">
        <thead>
            <tr class="text-left bg-gray-100">
                <th class="py-3 px-4 border-b">#</th>
                <th class="py-3 px-4 border-b">Name</th>
                <th class="py-3 px-4 border-b">Email</th>
                <th class="py-3 px-4 border-b">Age</th>
                <th class="py-3 px-4 border-b">Gender</th>
                <th class="py-3 px-4 border-b">Department</th>
                <th class="py-3 px-4 border-b">Date</th>
                <th class="py-3 px-4 border-b">Time</th>
                <th class="py-3 px-4 border-b">Doctor</th>
                <th class="py-3 px-4 border-b">Fees</th>
                <th class="py-3 px-4 border-b">Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Rows will be dynamically added here -->
        </tbody>
    </table>
</div>

<!-- Modal (Hidden by default) -->
<!-- Modal (Hidden by default) -->
<div id="appointmentModal" class="fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg w-full max-w-md sm:max-w-sm md:max-w-lg">
        <div class="flex justify-between ">
            <h2 class="text-lg font-semibold">Book an Appointment</h2>
            <button id="closeModalBtn" class="text-gray-500 text-xl">&times;</button>
        </div>
        <form class="mt-4 text-xs">
            <div class="mb-4">
                <label for="patientName" class="block">Patient Name *</label>
                <input type="text" id="patientName" class="w-full border rounded p-2" placeholder="Patient Name" required />
            </div>
            <div class="mb-4">
                <label for="department" class="block">Departments *</label>
                <select id="department" class="w-full border rounded p-2" required>
                    <option>Eye Care</option>
                    <option>Dental</option>
                    <option>Cardiology</option>
                    <option>Gynecology</option>
                    <option>Orthopedic</option>
                    <!-- Add more departments as needed -->
                </select>
            </div>
            <div class="mb-4">
                <label for="doctor" class="block">Doctor *</label>
                <select id="doctor" class="w-full border rounded p-2" required>
                    <option>Dr. Calvin Carlo</option>
                    <option>Dr. Cristino Murphy</option>
                    <option>Dr. Alia Reddy</option>
                    <option>Dr. Toni Kovar</option>
                    <!-- Add more doctors as needed -->
                </select>
            </div>
            <div class="mb-4">
                <label for="email" class="block">Your Email *</label>
                <input type="email" id="email" class="w-full border rounded p-2" placeholder="Your Email" required />
            </div>
            <div class="mb-4">
                <label for="phone" class="block">Your Phone *</label>
                <input type="text" id="phone" class="w-full border rounded p-2" placeholder="Your Phone" required />
            </div>
            <div class="mb-4">
                <label for="date" class="block">Date *</label>
                <input type="date" id="date" class="w-full border rounded p-2" required />
            </div>
            <div class="mb-4">
                <label for="time" class="block">Time *</label>
                <input type="time" id="time" class="w-full border rounded p-2" required />
            </div>
            <div class="mb-4">
                <label for="comments" class="block">Comments *</label>
                <textarea id="comments" class="w-full border rounded p-2" placeholder="Your Message" required></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg">
                Book An Appointment
            </button>
        </form>
    </div>
</div>



    <script src="../JS/appointment.js"></script>
    <script>
        // Modal functionality
        const addAppointmentBtn = document.getElementById("addAppointmentBtn");
        const appointmentModal = document.getElementById("appointmentModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        
        // Show modal
        addAppointmentBtn.addEventListener("click", () => {
            appointmentModal.classList.remove("hidden");
        });
        
        // Close modal
        closeModalBtn.addEventListener("click", () => {
            appointmentModal.classList.add("hidden");
        });
        
        // Optionally, close modal if clicked outside the modal content
        appointmentModal.addEventListener("click", (event) => {
            if (event.target === appointmentModal) {
                appointmentModal.classList.add("hidden");
            }
        });
        </script>
</body>

</html>
